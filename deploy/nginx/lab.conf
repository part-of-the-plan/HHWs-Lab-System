# ═══════════════════════════════════════════════════════════════
# 实验室设备管理系统 —— Nginx 反向代理 + HTTPS 配置
#
# 部署位置（Ubuntu）：
#   sudo cp deploy/nginx/lab.conf /etc/nginx/sites-available/lab.conf
#   sudo ln -s /etc/nginx/sites-available/lab.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # 去掉默认站点
#   sudo nginx -t && sudo systemctl reload nginx
#
# 需要先准备好（见 deploy/gen_cert.sh）：
#   /etc/nginx/ssl/lab.crt   自签证书
#   /etc/nginx/ssl/lab.key   私钥
#
# 把下面的 server_name 改成你的域名或公网 IP
# ═══════════════════════════════════════════════════════════════

# ---- HTTP：一律 301 跳转到 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name 49.233.177.123;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS：主站点 ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 49.233.177.123;

    # ---- 证书 ----
    ssl_certificate     /etc/nginx/ssl/lab.crt;
    ssl_certificate_key /etc/nginx/ssl/lab.key;

    # ---- TLS 安全基线（只留 TLS1.2/1.3）----
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "DENY"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 请求体上限（防超大请求；本系统无大文件上传，2M 足够）
    client_max_body_size 2m;

    # ---- 前端静态资源（Vite 构建产物 dist/）----
    root  /var/www/lab/dist;
    index index.html;

    # 静态文件长缓存（带 hash 文件名，安全）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback：找不到文件回退 index.html，刷新子路由不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API 反代到 Gunicorn（127.0.0.1:5000）----
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # 透传真实客户端信息（后端 audit 记录真实 IP 依赖这些头）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
